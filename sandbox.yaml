apis:
  payments:
    type: mock
    endpoints:
      - method: POST
        path: /charge
        request: { customer_id: integer, amount: real, currency: text }
        response:
          status: 200
          body: { id: "ch_1000", customer_id: "{customer_id}", amount: "{amount}", status: "succeeded" }

      - method: GET
        path: /charge/{charge_id}
        response:
          status: 200
          body: { id: "{charge_id}", status: "succeeded" }

      - method: POST
        path: /refund
        request: { charge_id: text }
        response:
          status: 200
          body: { id: "re_2000", charge_id: "{charge_id}", status: "refunded" }

  shipping:
    type: mock
    endpoints:
      - method: GET
        path: /rates
        response:
          status: 200
          body:
            rates:
              - { carrier: "ups",   price: 5.99, eta_days: 3 }
              - { carrier: "fedex", price: 9.99, eta_days: 1 }

      - method: POST
        path: /shipments
        request: { order_id: integer, carrier: text }
        response:
          status: 201
          body: { tracking_id: "trk_abc123", order_id: "{order_id}", carrier: "{carrier}", status: "created" }