# ─────────────────────────────────────────────────────────────
# A personal agent sandbox. The agent asks for these by name.
# The broker provisions them for the duration of one run.
# ─────────────────────────────────────────────────────────────

databases:
  shop:
    type: sqlite
    tables:
      customers:
        columns:
          id: integer
          name: text
          email: text
          country: text
        seed:
          - { id: 1,  name: "Alice",   email: "alice@example.com",   country: "US" }
          - { id: 2,  name: "Bob",     email: "bob@example.com",     country: "UK" }
          - { id: 3,  name: "Carol",   email: "carol@example.com",   country: "DE" }
          - { id: 4,  name: "Dan",     email: "dan@example.com",     country: "US" }
          - { id: 5,  name: "Eve",     email: "eve@example.com",     country: "FR" }
          - { id: 6,  name: "Frank",   email: "frank@example.com",   country: "US" }
          - { id: 7,  name: "Grace",   email: null,                  country: "JP" }
          - { id: 8,  name: "Heidi",   email: "heidi@example.com",   country: "UK" }
          - { id: 9,  name: "Ivan",    email: "ivan@example.com",    country: "RU" }
          - { id: 10, name: "Judy",    email: "judy@example.com",    country: "US" }

