apis:
  orders:
    type: sql
    database: shop
    endpoints:
      - method: GET
        path: /orders
        params:
          status: { type: text, required: false }
        sql: "SELECT id, customer_id, status, total, created_at FROM orders WHERE status = COALESCE(?, status)"
        on_success: { status: 200, body: "{rows}" }

      - method: POST
        path: /orders/{id}/cancel
        params:
          id: { type: integer, required: true, min: 1, source: path }
        sql: "UPDATE orders SET status = 'cancelled' WHERE id = ? AND status IN ('pending','paid')"
        on_success: { status: 200, body: { ok: true } }
        on_not_found: { status: 404, body: { error: "not_found", message: "Order {id} does not exist" } }
        on_conflict: { status: 409, body: { error: "invalid_state", message: "Order {id} is not cancellable" } }
        on_invalid: { status: 400, body: { error: "invalid_input" } }

  payments:
    type: sql
    database: shop
    endpoints:
      - method: POST
        path: /charge
        params:
          customer_id: { type: integer, required: true, source: body }
          amount:      { type: real,    required: true, source: body }
          currency:    { type: text,    required: true, source: body }
        sql: "INSERT INTO charges (id, customer_id, amount, currency, status, created_at) VALUES ('ch_' || lower(hex(randomblob(4))), ?, ?, ?, 'succeeded', date('now')) RETURNING id, customer_id, amount, status"
        on_success: { status: 200, body: "{rows[0]}" }
        on_invalid: { status: 400, body: { error: "invalid_input" } }

      - method: POST
        path: /refund
        params:
          charge_id: { type: text, required: true, source: body }
        sql: "UPDATE charges SET status='refunded' WHERE id = ? AND status='succeeded'"
        on_success: { status: 200, body: { ok: true } }
        on_not_found: { status: 404, body: { error: "not_found" } }
        on_conflict: { status: 409, body: { error: "not_refundable" } }
        on_invalid: { status: 400, body: { error: "invalid_input" } }

  shipping:
    type: sql
    database: shop
    endpoints:
      - method: GET
        path: /rates
        sql: "SELECT 'ups' AS carrier, 5.99 AS price, 3 AS eta_days UNION ALL SELECT 'fedex', 9.99, 1"
        on_success: { status: 200, body: { rates: "{rows}" } }

      - method: POST
        path: /shipments
        params:
          order_id: { type: integer, required: true, source: body }
          carrier:  { type: text,    required: true, source: body }
        sql: "INSERT INTO shipments (tracking_id, order_id, carrier, status, created_at) VALUES ('trk_' || lower(hex(randomblob(4))), ?, ?, 'created', date('now')) RETURNING tracking_id, order_id, carrier, status"
        on_success: { status: 201, body: "{rows[0]}" }
        on_invalid: { status: 400, body: { error: "invalid_input" } }